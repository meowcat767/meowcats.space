  <body>
    <div class="container masterContainer">
      <nav class="navbar navbar-expand-lg navbar-dark mb-3">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#vistaNavbar" aria-controls="vistaNavbar" aria-expanded="false" aria-label="Toggle navigation">

        </button>
        <div class="collapse navbar-collapse" id="vistaNavbar">
          <ul class="navbar-nav mr-auto">

        <div class="aero-gallery-grid" id="lightgallery">

    <script src="https://cdn.jsdelivr.net/npm/lightgallery@3.0.0/plugins/thumbnail/lg-thumbnail.umd.js"></script>
    <script>
      lightGallery(document.getElementById('lightgallery'), {
        plugins: [lgZoom, lgThumbnail],
        licenseKey: '0000-0000-000-0000'
